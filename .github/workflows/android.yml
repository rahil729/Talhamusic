name: Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug

      - name: Rename APK for distribution
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TalhaMusic.apk

      - name: Upload Talha Music APK
        uses: actions/upload-artifact@v4
        with:
          name: TalhaMusic
          path: app/build/outputs/apk/debug/TalhaMusic.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/TalhaMusic.apk
