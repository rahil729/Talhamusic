name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Build and name Talha Rahil APK
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare public download
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Talha-Rahil.apk

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Talha Rahil ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/Talha-Rahil.apk

      - name: Upload APK build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Talha-Rahil
          path: app/build/outputs/apk/debug/Talha-Rahil.apk
